name: Test Android build
on:
  pull_request:
    paths:
      - .github/workflows/build-android.yml
      - android/**
      - cpp/**
      - example/package.json
      - example/android/**
      - react-native.config.js
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android.yml
      - android/**
      - cpp/**
      - example/package.json
      - example/android/**
      - react-native.config.js

jobs:
  build:
    if: github.repository == 'Expensify/react-native-live-markdown'
    runs-on: ubuntu-latest
    concurrency:
      group: build-android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # v5.0.0
      - name: Check out Git repository
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493

      # v5.0.0
      - name: Setup Java 17
        uses: actions/setup-java@ead9eaa3cfe0b0fc2fa749519ae09c3d4f4080b0
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Block compromised Java certificates
        uses: Expensify/GitHub-Actions/block-compromised-java-certificates@d8dfc3ddd4d8626206653c6168ca8d094547749a

      - name: Restrict Gradle to the protected JDK
        run: |
          # Prevent cached or downloaded toolchains from bypassing the certificate blocklist.
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          org.gradle.java.installations.auto-detect=false
          org.gradle.java.installations.auto-download=false
          org.gradle.java.installations.fromEnv=JAVA_HOME
          org.gradle.java.installations.paths=$JAVA_HOME
          EOF

      # v6.0.0
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version-file: '.nvmrc'

      - name: Install node_modules
        run: npm ci

      - name: Build app
        working-directory: example/android
        run: ./gradlew assembleDebug --build-cache -PreactNativeArchitectures=arm64-v8a
